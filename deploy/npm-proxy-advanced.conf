# NPM 2.11.2 server-level Advanced config for ONLY media.example.com.
# Keep the Proxy Host DISABLED until the 0.7 production acceptance/reset gates pass.
# Forward: HTTPS -> 192.0.2.10:8390; caching/websocket upgrade/HSTS disabled.
# CA is a public certificate, not a key; placed in NPM /data by the operator.
proxy_ssl_server_name on;
proxy_ssl_name media.example.com;
proxy_ssl_trusted_certificate /data/media-lab-origin-ca.crt;
proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_http_version 1.1;
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 600s;
proxy_send_timeout 600s;
client_max_body_size 501m;
