[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-lab-runtime"
version = "0.9.1"
description = "Private multi-user web runtime for Media Lab"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.138.1",
  "starlette==1.3.1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "Pillow>=10.4,<13",
  "python-multipart>=0.0.18,<1",
  "websocket-client>=1.8,<2",
  "argon2-cffi>=25.1,<26",
  "cryptography>=46,<51",
  "pyotp>=2.10,<3",
  "qrcode[pil]==8.2",
  "mcp==2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
